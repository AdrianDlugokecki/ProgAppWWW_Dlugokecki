<h1>Formularz kontaktowy i wycena</h1>

<form id="order-form" novalidate>
    <div class="form-group">
        <label for="produkt-select">Wybierz produkt:</label>
        <select id="produkt-select" name="produkt">
            <option value="klawiatura">Klawiatura Mechaniczna (299,00 zł)</option>
            <option value="mysz">Mysz Bezprzewodowa (159,00 zł)</option>
            <option value="sluchawki">Słuchawki nauszne (249,00 zł)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="ilosc">Ilość (1–5 szt.):</label>
        <input type="number" id="ilosc" name="ilosc" min="1" max="5" step="1" value="1" required>
    </div>

    <p id="price-preview" class="price-preview" aria-live="polite">Szacowana wartość: 299,00 zł</p>

    <div class="form-group">
        <label for="wiadomosc">Treść zapytania (min. 10 znaków):</label>
        <textarea id="wiadomosc" name="wiadomosc" rows="5" required></textarea>
        <p id="wiadomosc-error" class="field-error" role="alert" hidden></p>
    </div>

    <button type="submit">Wyślij zapytanie</button>
</form>

<section id="order-summary" class="order-summary" aria-live="polite" hidden>
    <h2>Podsumowanie zapytania</h2>
    <p><strong>Produkt:</strong> <span id="summary-product"></span></p>
    <p><strong>Ilość:</strong> <span id="summary-quantity"></span></p>
    <p><strong>Wartość całkowita:</strong> <span id="summary-total"></span></p>
    <p><strong>Wiadomość:</strong> <span id="summary-message"></span></p>
</section>
