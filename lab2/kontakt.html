<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt i Formularz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="produkt.html">Produkt</a></li>
                <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
            </ul>
            <button type="button" id="theme-toggle" class="btn-theme" aria-pressed="false">Tryb ciemny</button>
        </nav>
    </header>

    <main>
        <h1>Formularz zapytania</h1>

        <p>Podgląd lokalny. Formularz nie wysyła wiadomości.</p>

        <form action="kontakt.html" method="get" class="contact-form" id="contact-form">
            <div class="form-group">
                <label for="email">E-mail (wymagane):</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="produkt">Produkt (wymagane):</label>
                <select id="produkt" name="produkt" required>
                    <option value="">Wybierz produkt</option>
                    <option value="produkt1">Klawiatura mechaniczna (299,00 zł)</option>
                    <option value="produkt2">Mysz Bezprzewodowa (159,00 zł)</option>
                    <option value="produkt3">Słuchawki nauszne (249,00 zł)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ilosc">Liczba sztuk (od 1 do 5, wymagane):</label>
                <input type="number" id="ilosc" name="ilosc" min="1" max="5" step="1" required>
            </div>

            <div class="price-box" aria-live="polite">
                <strong>Szacowana wartość:</strong>
                <span id="price-preview">Wybierz produkt i podaj poprawną liczbę sztuk (1–5).</span>
            </div>

            <div class="form-group">
                <label for="wiadomosc">Wiadomość (od 10 do 500 znaków, wymagane):</label>
                <textarea id="wiadomosc" name="wiadomosc" minlength="10" maxlength="500" required></textarea>
                <p id="wiadomosc-error" class="error-message" hidden></p>
            </div>

            <button type="submit">Sprawdź zapytanie</button>
        </form>

        <section id="order-summary" class="summary-box" aria-live="polite" hidden>
            <h2>Podsumowanie zapytania (podgląd lokalny)</h2>
            <p><strong>Produkt:</strong> <span id="summary-product"></span></p>
            <p><strong>Ilość:</strong> <span id="summary-quantity"></span></p>
            <p><strong>Wartość całkowita:</strong> <span id="summary-total"></span></p>
            <p><strong>Treść wiadomości:</strong></p>
            <blockquote id="summary-message" class="summary-quote"></blockquote>
        </section>
    </main>

    <footer>
        <p>Stopka strony</p>
    </footer>

</body>
</html>
